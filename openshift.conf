# 1. Main OpenShift Web Console
server {
    listen 443 ssl http2;
    server_name openshift.chrimson.net;

    ssl_certificate     /etc/letsencrypt/live/openshift.chrimson.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openshift.chrimson.net/privkey.pem;

    location / {
        proxy_pass https://192.168.0.241:443;
        proxy_ssl_verify off;

        # CRITICAL: Overrides the SNI name sent during the upstream TLS handshake
        proxy_ssl_server_name on;
        proxy_ssl_name console-openshift-console.apps-crc.testing;

        # Force internal HTTP Host header for OpenShift's router
        proxy_set_header Host console-openshift-console.apps-crc.testing;

        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Intercept 302 redirects
        proxy_redirect https://console-openshift-console.apps-crc.testing/ https://openshift.chrimson.net/;
        proxy_redirect https://oauth-openshift.apps-crc.testing/ https://oauth-openshift.apps.openshift.chrimson.net/;

        # Search & replace payload URLs
        sub_filter_once off;
        sub_filter_types *;
        sub_filter 'console-openshift-console.apps-crc.testing' 'openshift.chrimson.net';
        sub_filter 'oauth-openshift.apps-crc.testing' 'oauth-openshift.apps.openshift.chrimson.net';

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}


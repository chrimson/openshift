# 1. Console Proxy
server {
    listen 443 ssl http2;
    server_name openshift.chrimson.net;

    ssl_certificate /etc/letsencrypt/live/openshift.chrimson.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openshift.chrimson.net/privkey.pem;

    # Require decompressed responses so Nginx can search and replace inside JS/JSON
    proxy_set_header Accept-Encoding "";

    location / {
        proxy_pass https://192.168.0.241:443;

        proxy_set_header Host console-openshift-console.apps-crc.testing;
        
        # Replace occurrences in JS config bundles sent to the browser
        sub_filter 'console-openshift-console.apps-crc.testing' 'openshift.chrimson.net';
        sub_filter 'oauth-openshift.apps-crc.testing' 'oauth-openshift.chrimson.net';
        sub_filter_once off;
        sub_filter_types text/xml text/css text/javascript application/javascript application/json;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name console-openshift-console.apps-crc.testing;

        proxy_redirect https://oauth-openshift.apps-crc.testing/ https://oauth-openshift.chrimson.net/;
        proxy_redirect https://console-openshift-console.apps-crc.testing/ https://openshift.chrimson.net/;
    }
}

# 2. OAuth Proxy
server {
    listen 443 ssl http2;
    server_name oauth-openshift.chrimson.net;

    ssl_certificate /etc/letsencrypt/live/openshift.chrimson.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openshift.chrimson.net/privkey.pem;

    location / {
        proxy_pass https://192.168.0.241:443;

        # Override host header to match CRC OAuth route
        proxy_set_header Host oauth-openshift.apps-crc.testing;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name oauth-openshift.apps-crc.testing;

        # Translate console redirect URIs during OAuth handshake
        proxy_redirect https://console-openshift-console.apps-crc.testing/ https://openshift.chrimson.net/;
        proxy_redirect https://oauth-openshift.apps-crc.testing/ https://oauth-openshift.chrimson.net/;
    }
}

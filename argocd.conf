server {
    listen 443 ssl http2;
    server_name argocd.chrimson.net;

    ssl_certificate /etc/letsencrypt/live/argocd.chrimson.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/argocd.chrimson.net/privkey.pem;

    location / {
        proxy_pass https://192.168.0.241:443;

        # CRITICAL: Enables TLS SNI for OpenShift Passthrough Route
        proxy_ssl_server_name on;
        proxy_ssl_name argocd.chrimson.net;
        proxy_ssl_verify off;

        # Standard Headers
        proxy_set_header Host argocd.chrimson.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSockets & gRPC
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
